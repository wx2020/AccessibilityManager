name: Build APK and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 1.2.0)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Download AOSP testkey
        run: |
          wget https://android.googlesource.com/platform/build/+/refs/heads/master/target/product/security/testkey.x509.pem?format=TEXT -O testkey.pem.b64
          wget https://android.googlesource.com/platform/build/+/refs/heads/master/target/product/security/testkey.pk8?format=TEXT -O testkey.pk8.b64
          base64 -d testkey.pem.b64 > testkey.x509.pem
          base64 -d testkey.pk8.b64 > testkey.pk8

      - name: Download signapk
        run: |
          wget https://github.com/appium/sign/releases/download/v1.0.0/signapk.jar

      - name: Sign APK
        run: |
          java -jar signapk.jar \
            testkey.x509.pem \
            testkey.pk8 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-v${{ github.event.inputs.version }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          files: app-v${{ github.event.inputs.version }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
